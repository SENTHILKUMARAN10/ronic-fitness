name: Publish Ronic Fitness website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'robots.txt'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          test -f index.html
          mkdir -p _site
          cp index.html privacy.html robots.txt _site/
          cp -R assets css js _site/
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
